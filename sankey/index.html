<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisation Sankey - Valorisation Textile</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
</head>
<body>
    <div class="w-full flex justify-start p-4">
        <a href="../index.html" class="inline-flex items-center px-3 py-1 rounded bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm font-medium shadow-sm border border-gray-200">
            ← Retour
        </a>
    </div>
    <div class="container">
        <div class="controls flex flex-wrap gap-4 items-center mb-4">
            <select id="dimension-selector" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
                <option value="format" selected>Formats</option>
                <option value="format_type">- Types</option>
                <option value="matiere">-- Matière</option>
                <option value="fibres">--- Fibres</option>
                <option value="couleur">-- Couleur</option>
                <option value="perturbateurs">-- Perturbateurs</option>
                <option value="qualite">Qualité</option>
                <option value="proprete">Propreté</option>
            </select>
            <select id="scenario-selector" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition">
            </select>
        </div>
        <div id="sankey-container"></div>
    </div>
    <script src="../data/processes.js"></script>
    <script src="../data/scenario-data.js"></script>
    <script src="../data/data.js"></script>
    <script src="scenario.js"></script>
    <script src="sankey.js"></script>
    <script>
      console.log('[HTML] script chargé');
      document.addEventListener('sankeyScenarioReady', function() {
        console.log('[HTML] sankeyScenarioReady reçu');
      });
      document.addEventListener('DOMContentLoaded', function() {
        console.log('[HTML] DOMContentLoaded');
        function launchSankeyFromSelectors(lot) {
          const scenarioIdx = document.getElementById('scenario-selector').value;
          const scenario = window.scenarios[scenarioIdx]?.scenario;
          const dimension = document.getElementById('dimension-selector').value;
          if (typeof runSankey === 'function' && lot && scenario) {
            runSankey({
              lot,
              scenario,
              containerId: 'sankey-container',
              dimension
            });
          }
        }

        // Charger le lot_type.json
        fetch('../data/lot_type.json')
          .then(r => r.json())
          .then(lot => {
            window.lotType = lot; // pour compatibilité temporaire
            setTimeout(() => {
              launchSankeyFromSelectors(lot);
              document.getElementById('scenario-selector').addEventListener('change', () => launchSankeyFromSelectors(lot));
              document.getElementById('dimension-selector').addEventListener('change', () => launchSankeyFromSelectors(lot));
            }, 0);
          });
      });

      window.afficherPopupTransfo = function(ref, mode) {
        const backdrop = document.createElement('div');
        backdrop.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
        const modal = document.createElement('div');
        modal.className = 'bg-white rounded-lg shadow-xl w-full max-w-md mx-4 p-6';
        
        // Extraction de la transformation du lien
        const transformation = ref.link ? ref.link.target.name : '';
        // Séparation du type et des paramètres
        const [type, ...params] = transformation.split(':').map(s => s.trim());
        
        modal.innerHTML = `
          <h3 class="text-lg font-semibold mb-4">Ajouter une transformation</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Transformation actuelle</label>
              <div class="p-2 bg-gray-100 rounded-lg text-gray-700">
                <div class="font-medium">${type || 'Aucune transformation'}</div>
                ${params.length > 0 ? `<div class="text-sm text-gray-600 mt-1">${params.join(', ')}</div>` : ''}
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Type de transformation</label>
              <select id="transfo-type" class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400">
                <option value="selectByFormat">Sélection par format</option>
                <option value="selectByType">Sélection par type</option>
                <option value="selectByMatiere">Sélection par matière</option>
                <option value="selectByFibre">Sélection par fibre</option>
                <option value="selectByCouleur">Sélection par couleur</option>
                <option value="selectByQualite">Sélection par qualité</option>
                <option value="selectByProprete">Sélection par propreté</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Destination</label>
              <input type="text" id="target-input" class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400" placeholder="Nom de la destination">
            </div>
          </div>
          <div class="mt-6 flex justify-end space-x-3">
            <button id="cancel-btn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Annuler</button>
            <button id="save-btn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Enregistrer</button>
          </div>
        `;
        backdrop.appendChild(modal);
        document.body.appendChild(backdrop);
        
        const cancelBtn = modal.querySelector('#cancel-btn');
        const saveBtn = modal.querySelector('#save-btn');
        const transfoTypeSelect = modal.querySelector('#transfo-type');
        
        cancelBtn.onclick = () => backdrop.remove();
        saveBtn.onclick = () => {
          const target = modal.querySelector('#target-input').value;
          const transformation = {
            type: [transfoTypeSelect.value],
            keys: [[]],
            scenario: {
              target: target || undefined
            }
          };
          console.log('Nouvelle transformation:', transformation);
          backdrop.remove();
        };
        
        backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
      };
    </script>
</body>
</html>
