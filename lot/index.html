<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Création / Modification de Lot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="lot-container">
    <div id="stackbar-container"></div>
  </div>
  <script>
    fetch('../lot_type.json')
      .then(res => res.json())
      .then(lot => {
        window.lotInitial = lot;
        lancerLotUI(document.getElementById('stackbar-container'), window.lotInitial);
        window.onLotChange = (lot) => {
          console.log('Lot modifié :', lot);
        };
      });
  </script>
  <script src="lot.js"></script>
</body>
</html>
