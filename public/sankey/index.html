<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualisation Sankey - Valorisation Textile</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
  </head>
  <body>
    <!-- Header avec dropdown des dimensions -->
    <div class="bg-white px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <label class="text-sm font-medium text-gray-700">Dimension :</label>
        <div class="relative">
          <select
            id="dimension-select"
            class="appearance-none bg-white border border-gray-300 rounded-md px-3 py-2 pr-8 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 cursor-pointer"
            style="min-width: 140px"
          ></select>
          <div
            class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none"
          >
            <svg
              class="h-4 w-4 text-gray-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div style="position: relative">
      <div id="sankey-container"></div>
      <div
        style="display: flex; justify-content: flex-end"
        id="save-btn-container"
      >
        <button
          id="save-scenario-btn"
          disabled
          style="
            padding: 8px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
          "
        >
          Enregistrer
        </button>
      </div>
    </div>
    <script>
      console.log('[HTML] script chargé');

      // Variables globales
      let currentDimension = 'formats';
      let dimensions = [
        { value: 'formats', label: 'Formats' },
        { value: 'types', label: 'Types' },
        { value: 'matieres', label: 'Matières' },
        { value: 'fibres', label: 'Fibres' },
        { value: 'couleurs', label: 'Couleurs' },
        { value: 'perturbateurs', label: 'Perturbateurs' },
        { value: 'qualite', label: 'Qualité' },
        { value: 'proprete', label: 'Propreté' },
      ];

      // Fonction pour charger les dimensions depuis Bubble
      async function loadDimensionsFromBubble(isLive) {
        try {
          console.log(
            '[HTML] Chargement des dimensions depuis Bubble, isLive:',
            isLive
          );

          const response = await fetch('/api/bubble', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              endpoint: 'dimensions',
              params: { isLive },
              method: 'GET',
            }),
          });

          if (!response.ok) {
            throw new Error(`Erreur API: ${response.status}`);
          }

          const bubbleDimensions = await response.json();
          console.log(
            '[HTML] Dimensions récupérées depuis Bubble:',
            bubbleDimensions
          );

          // Transformer les données Bubble en format attendu
          if (bubbleDimensions && typeof bubbleDimensions === 'object') {
            // Si c'est un objet, convertir en array
            if (Array.isArray(bubbleDimensions)) {
              dimensions = bubbleDimensions.map(dim => ({
                value: dim.value || dim.name || dim.id,
                label: dim.label || dim.title || dim.name || dim.id,
              }));
            } else {
              // Si c'est un objet avec des clés, convertir en array
              dimensions = Object.keys(bubbleDimensions).map(key => ({
                value: key,
                label: bubbleDimensions[key].fr_fr || key, // Utiliser la traduction française
              }));
            }

            console.log('[HTML] Dimensions transformées:', dimensions);
          } else {
            console.log(
              '[HTML] Aucune dimension reçue de Bubble, utilisation des dimensions par défaut'
            );
          }
        } catch (error) {
          console.error(
            '[HTML] Erreur lors du chargement des dimensions:',
            error
          );
          console.log('[HTML] Utilisation des dimensions par défaut');
          // Garder les dimensions par défaut en cas d'erreur
        } finally {
          // Toujours mettre à jour le dropdown, même en cas d'erreur
          updateDimensionDropdown();
        }
      }

      // Fonction pour mettre à jour le dropdown des dimensions
      function updateDimensionDropdown() {
        const select = document.getElementById('dimension-select');
        if (!select) return;

        // Sauvegarder la valeur actuelle
        const currentValue = select.value;

        // Vider le select
        select.innerHTML = '';

        // Ajouter les nouvelles options
        dimensions.forEach(dim => {
          const option = document.createElement('option');
          option.value = dim.value;
          option.textContent = dim.label;
          select.appendChild(option);
        });

        // Restaurer la valeur actuelle si elle existe encore, sinon prendre la première
        if (dimensions.find(d => d.value === currentValue)) {
          select.value = currentValue;
        } else if (dimensions.length > 0) {
          select.value = dimensions[0].value;
        }
      }

      // Fonction utilitaire pour lire les paramètres d'URL
      function getUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        return {
          dimension: 'formats', // Dimension par défaut, plus de paramètre dans l'URL
          scenarioId: urlParams.get('scenarioId') || '',
          lotId: urlParams.get('lotId') || '',
          teamId: urlParams.get('teamId') || '',
          isLive: urlParams.get('isLive') === 'true',
          isEditable: urlParams.get('isEditable') !== 'false', // true par défaut
        };
      }

      // Fonction pour gérer l'état du bouton Enregistrer
      function setScenarioModifie(modifie) {
        const saveBtn = document.getElementById('save-scenario-btn');
        window._scenarioModifie = !!modifie;
        if (saveBtn) {
          saveBtn.disabled = !modifie;
          saveBtn.style.opacity = modifie ? '1' : '0.5';
        }
      }

      // Fonction pour lancer le Sankey avec une dimension spécifique
      function launchSankeyFromUrl(lot, scenario, dimension = null) {
        const params = getUrlParams();
        const selectedDimension = dimension || params.dimension;

        console.log('[HTML] Lancement Sankey avec:', {
          lot,
          scenario,
          dimension: selectedDimension,
          availableScenarios: window.scenarios?.length || 0,
        });

        if (typeof runSankey === 'function' && lot && scenario) {
          runSankey({
            lot,
            scenario,
            containerId: 'sankey-container',
            dimension: selectedDimension,
          });
        } else {
          console.error('[HTML] Impossible de lancer le Sankey:', {
            runSankeyExists: typeof runSankey === 'function',
            lotExists: !!lot,
            scenarioExists: !!scenario,
            scenarios: window.scenarios,
          });
        }
      }

      // Fonction pour charger un scénario depuis l'API Bubble
      function loadScenarioFromAPI(scenarioId, isLive) {
        console.log("[HTML] Chargement du scénario depuis l'API Bubble:", {
          scenarioId,
          isLive,
        });

        return fetch('/api/bubble', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            endpoint: 'scenario',
            params: {
              id: scenarioId,
              isLive: isLive,
            },
            method: 'POST',
          }),
        })
          .then(response => {
            if (!response.ok) {
              throw new Error(`Erreur API: ${response.status}`);
            }
            return response.json();
          })
          .then(scenario => {
            console.log('[HTML] Scénario chargé depuis API Bubble:', scenario);
            return scenario;
          })
          .catch(error => {
            console.error(
              '[HTML] Erreur lors du chargement du scénario depuis API:',
              error
            );
            // Pas de fallback vers scenario-data.js car supprimé
            throw new Error("Impossible de charger le scénario depuis l'API");
          });
      }

      document.addEventListener('DOMContentLoaded', function () {
        console.log('[HTML] DOMContentLoaded');

        const params = getUrlParams();

        // Initialiser le dropdown des dimensions
        const dimensionSelect = document.getElementById('dimension-select');
        if (dimensionSelect) {
          // Définir la valeur initiale depuis les paramètres d'URL
          dimensionSelect.value = params.dimension;
          currentDimension = params.dimension;

          // Gestion du changement de dimension
          dimensionSelect.addEventListener('change', function () {
            const newDimension = this.value;
            console.log('[HTML] Changement de dimension:', newDimension);
            currentDimension = newDimension;

            // Relancer le Sankey avec la nouvelle dimension si les données sont disponibles
            if (
              window.lotType &&
              window.scenarios &&
              window.scenarios.length > 0
            ) {
              const currentScenario =
                window.scenarios[window.currentScenarioIdx];
              if (currentScenario && currentScenario.scenario) {
                launchSankeyFromUrl(
                  window.lotType,
                  currentScenario.scenario,
                  newDimension
                );
              }
            }
          });
        }

        // Charger les dimensions depuis Bubble
        loadDimensionsFromBubble(params.isLive);

        // Initialiser l'état du bouton Enregistrer
        setScenarioModifie(false);

        // Afficher le bouton Enregistrer seulement si isEditable
        var saveBtnContainer = document.getElementById('save-btn-container');
        console.log('[HTML] Debug bouton Enregistrer:', {
          isEditable: params.isEditable,
          isEditableType: typeof params.isEditable,
          isEditableFalse: params.isEditable === false,
          saveBtnContainer: !!saveBtnContainer,
        });
        if (saveBtnContainer) {
          // Forcer l'affichage du bouton pour debug
          saveBtnContainer.style.display = 'flex';
          saveBtnContainer.style.height = '50px'; // Pour voir le container
        }

        // Gestion du clic sur le bouton Enregistrer
        const saveBtn = document.getElementById('save-scenario-btn');
        if (saveBtn) {
          saveBtn.addEventListener('click', async function () {
            if (window.sankeyScenario && window._scenarioModifie) {
              saveBtn.disabled = true;
              saveBtn.textContent = 'Enregistrement...';
              saveBtn.style.opacity = '0.5';
              try {
                // Récupérer le scénario avec les transformations modifiées
                const currentScenario =
                  window.scenarios &&
                  window.scenarios[window.currentScenarioIdx];
                if (!currentScenario || !currentScenario.scenario) {
                  throw new Error('Aucun scénario trouvé à sauvegarder');
                }

                const response = await fetch('/api/bubble', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    endpoint: 'save',
                    params: {
                      scenario_id: params.scenarioId,
                      lot_id: '',
                      value: JSON.stringify(currentScenario.scenario),
                      isLive: params.isLive,
                    },
                    method: 'POST',
                  }),
                });
                if (!response.ok)
                  throw new Error('Erreur API: ' + response.status);
                saveBtn.textContent = 'Enregistré !';
                if (typeof setScenarioModifie === 'function') {
                  setScenarioModifie(false);
                }
                setTimeout(() => {
                  saveBtn.textContent = 'Enregistrer';
                }, 1500);
              } catch (e) {
                saveBtn.textContent = 'Erreur';
                setTimeout(() => {
                  saveBtn.textContent = 'Enregistrer';
                }, 2000);
                alert(
                  'Erreur lors de la sauvegarde du scénario : ' +
                    (e.message || e)
                );
              } finally {
                saveBtn.disabled = false;
                saveBtn.style.opacity = window._scenarioModifie ? '1' : '0.5';
              }
            }
          });
        }

        // Si on a un lotId, charger les données depuis l'API Bubble
        if (params.lotId) {
          console.log("[HTML] Chargement du lot depuis l'API Bubble:", params);

          // Appel API Bubble comme sur la page /lots
          fetch('/api/bubble', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              endpoint: 'lot',
              params: {
                id: params.lotId,
                isLive: params.isLive,
              },
              method: 'POST',
            }),
          })
            .then(response => {
              if (!response.ok) {
                throw new Error(`Erreur API: ${response.status}`);
              }
              return response.json();
            })
            .then(lot => {
              console.log('[HTML] Lot chargé depuis API Bubble:', lot);
              window.lotType = lot; // pour compatibilité temporaire

              // Maintenant charger le scénario depuis l'API
              // On utilise le scenarioId directement au lieu de l'index
              const scenarioId = params.scenarioId;
              // const scenarioIsLive = params.scenarioIsLive;

              // Charger le scénario depuis l'API Bubble
              if (scenarioId) {
                console.log(
                  '[HTML] Chargement du scénario avec ID:',
                  scenarioId
                );

                loadScenarioFromAPI(scenarioId, params.isLive)
                  .then(scenario => {
                    console.log('[HTML] Scénario chargé, lancement du Sankey');

                    // Créer la structure window.scenarios attendue par le code
                    window.scenarios = [
                      {
                        scenario: scenario,
                        title: scenario.nom || 'Scénario',
                        bubbleId: scenarioId,
                        isLive: params.isLive,
                      },
                    ];
                    window.currentScenarioIdx = 0;

                    launchSankeyFromUrl(lot, scenario, currentDimension);
                  })
                  .catch(error => {
                    console.error(
                      '[HTML] Erreur lors du chargement du scénario:',
                      error
                    );
                    // Pas de fallback vers scenario-data.js car supprimé
                    console.error('[HTML] Impossible de charger le scénario');
                  });
              } else {
                console.error('[HTML] Pas de scenarioId fourni');
              }
            })
            .catch(error => {
              console.error(
                '[HTML] Erreur lors du chargement du lot depuis API:',
                error
              );
              // Fallback vers le lot_type.json si l'API échoue
              fetch('../data/lot_type.json')
                .then(r => r.json())
                .then(lot => {
                  window.lotType = lot;
                  console.log('[HTML] Fallback vers lot_type.json:', lot);

                  // Charger le scénario depuis l'API
                  if (params.scenarioId) {
                    loadScenarioFromAPI(params.scenarioId, params.isLive)
                      .then(scenario => {
                        // Créer la structure window.scenarios attendue par le code
                        window.scenarios = [
                          {
                            scenario: scenario,
                            title: scenario.nom || 'Scénario',
                            bubbleId: params.scenarioId,
                            isLive: params.isLive,
                          },
                        ];
                        window.currentScenarioIdx = 0;

                        launchSankeyFromUrl(lot, scenario, currentDimension);
                      })
                      .catch(error => {
                        console.error(
                          '[HTML] Erreur lors du chargement du scénario:',
                          error
                        );
                        // Pas de fallback vers scenario-data.js car supprimé
                        console.error(
                          '[HTML] Impossible de charger le scénario'
                        );
                      });
                  } else {
                    console.error('[HTML] Pas de scenarioId fourni');
                  }
                });
            });
        } else {
          // Fallback vers le lot_type.json si pas de lotId
          fetch('../data/lot_type.json')
            .then(r => r.json())
            .then(lot => {
              window.lotType = lot;
              console.log('[HTML] Lot chargé depuis lot_type.json:', lot);

              // Charger le scénario depuis l'API
              if (params.scenarioId) {
                loadScenarioFromAPI(params.scenarioId, params.isLive)
                  .then(scenario => {
                    // Créer la structure window.scenarios attendue par le code
                    window.scenarios = [
                      {
                        scenario: scenario,
                        title: scenario.nom || 'Scénario',
                        bubbleId: params.scenarioId,
                        isLive: params.isLive,
                      },
                    ];
                    window.currentScenarioIdx = 0;

                    launchSankeyFromUrl(lot, scenario, currentDimension);
                  })
                  .catch(error => {
                    console.error(
                      '[HTML] Erreur lors du chargement du scénario:',
                      error
                    );
                    // Pas de fallback vers scenario-data.js car supprimé
                    console.error('[HTML] Impossible de charger le scénario');
                  });
              } else {
                console.error('[HTML] Pas de scenarioId fourni');
              }
            })
            .catch(error => {
              console.error('[HTML] Erreur lors du chargement du lot:', error);
            });
        }

        // Fonction utilitaire pour charger un JSON
        function fetchJSON(path) {
          return fetch(path).then(r => r.json());
        }

        // Fonction pour envoyer la hauteur au parent
        function sendHeightToParent() {
          const height = document.body.scrollHeight;
          console.log('[IFRAME] Envoi hauteur au parent :', height);
          window.parent.postMessage({ type: 'IFRAME_HEIGHT', height }, '*');
        }
        window.addEventListener('load', sendHeightToParent);
        window.addEventListener('resize', sendHeightToParent);
        // Appelle aussi après chaque modification de l'UI si besoin
        // Hook sur les mutations du DOM pour resize auto
        const observer = new MutationObserver(() => {
          sendHeightToParent();
        });
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true,
        });
      });
    </script>

    <script src="processes.js"></script>
    <script src="scenario.js"></script>
    <script src="transformation-popup.js"></script>
    <script src="tech-popup.js"></script>
    <script src="sankey.js"></script>
  </body>
</html>
