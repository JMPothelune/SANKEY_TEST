<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualisation Sankey - Valorisation Textile</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../styles/tailwind.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
  </head>
  <body>
    <div class="container">
      <div id="sankey-container"></div>
    </div>
    <script>
      console.log('[HTML] script chargé');

      // Fonction utilitaire pour lire les paramètres d'URL
      function getUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        return {
          dimension: urlParams.get('dimension') || 'format',
          scenarioIdx: parseInt(urlParams.get('scenarioIdx') || '0', 10),
          lotId: urlParams.get('lotId') || '',
          isEditable: urlParams.get('isEditable') === 'yes',
        };
      }

      // Fonction pour lancer le Sankey avec les paramètres d'URL
      function launchSankeyFromUrl(lot) {
        const params = getUrlParams();
        const scenarioIdx = params.scenarioIdx;

        console.log('[HTML] Paramètres reçus:', params);
        console.log('[HTML] Scénarios disponibles:', window.scenarios);
        console.log('[HTML] Index demandé:', scenarioIdx);
        console.log(
          "[HTML] Scénario à l'index demandé:",
          window.scenarios?.[scenarioIdx]
        );

        const scenario = window.scenarios[scenarioIdx]?.scenario;
        const dimension = params.dimension;

        console.log('[HTML] Lancement Sankey avec:', {
          lot,
          scenario,
          dimension,
          scenarioIdx,
          availableScenarios: window.scenarios?.length || 0,
        });

        if (typeof runSankey === 'function' && lot && scenario) {
          runSankey({
            lot,
            scenario,
            containerId: 'sankey-container',
            dimension,
          });
        } else {
          console.error('[HTML] Impossible de lancer le Sankey:', {
            runSankeyExists: typeof runSankey === 'function',
            lotExists: !!lot,
            scenarioExists: !!scenario,
            scenarios: window.scenarios,
          });
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        console.log('[HTML] DOMContentLoaded');

        // Charger le lot_type.json
        fetch('../data/lot_type.json')
          .then(r => r.json())
          .then(lot => {
            window.lotType = lot; // pour compatibilité temporaire
            console.log('[HTML] Lot chargé:', lot);

            // Attendre que tous les scripts soient chargés avant de lancer le Sankey
            setTimeout(() => {
              console.log(
                '[HTML] Vérification des scénarios:',
                window.scenarios
              );
              launchSankeyFromUrl(lot);
            }, 100);
          })
          .catch(error => {
            console.error('[HTML] Erreur lors du chargement du lot:', error);
          });

        // Fonction utilitaire pour charger un JSON
        function fetchJSON(path) {
          return fetch(path).then(r => r.json());
        }

        // Liste des fichiers de base à charger
        const baseFiles = {
          types: '../base_data/types.json',
          formats: '../base_data/formats.json',
          matieres: '../base_data/matieres.json',
          fibres: '../base_data/fibres.json',
          qualite: '../base_data/qualite.json',
          proprete: '../base_data/proprete.json',
          perturbateurs: '../base_data/perturbateurs.json',
          couleurs: '../base_data/couleurs.json',
        };

        // Chargement de tous les fichiers de base
        Promise.all(
          Object.entries(baseFiles).map(([key, path]) =>
            fetchJSON(path).then(data => [key, data])
          )
        )
          .then(entries => {
            window.baseData = Object.fromEntries(entries);
            console.log('[HTML] Base data chargée:', window.baseData);
          })
          .catch(error => {
            console.error(
              '[HTML] Erreur lors du chargement des données de base:',
              error
            );
          });
      });
    </script>
    <script src="../data/processes.js"></script>
    <script src="../data/scenario-data.js"></script>
    <script src="../data/data.js"></script>
    <script src="scenario.js"></script>
    <script src="transformation-popup.js"></script>
    <script src="sankey.js"></script>
  </body>
</html>
