<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test i18n</title>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.11/dist/umd/i18next.min.js"></script>
    <script src="i18n-config.js"></script>
  </head>
  <body>
    <h1>Test i18n</h1>

    <p>Langue actuelle: <span id="current-lang"></span></p>

    <div>
      <label data-i18n="dimension">Dimension :</label>
      <button data-i18n="save">Enregistrer</button>
      <button data-i18n="cancel">Annuler</button>
    </div>

    <div>
      <h3>Test de changement de langue</h3>
      <button onclick="changeLang('fr_fr')">Français</button>
      <button onclick="changeLang('en_gb')">English</button>
      <button onclick="changeLang('es_es')">Español</button>
      <button onclick="changeLang('de_de')">Deutsch</button>
    </div>

    <script>
      // Initialiser i18next
      const urlParams = new URLSearchParams(window.location.search);
      const lang = urlParams.get('lang') || 'fr_fr';

      console.log('Starting i18next initialization...');
      console.log('Config available:', !!window.i18nConfig);
      console.log('i18next available:', !!window.i18next);
      console.log('Config content:', window.i18nConfig);
      console.log('Resources structure:', window.i18nConfig.resources);
      console.log('fr_fr translations:', window.i18nConfig.resources.fr_fr);

      i18next
        .init({
          ...window.i18nConfig,
          lng: lang,
          fallbackLng: 'fr_fr',
          debug: true,
        })
        .then(() => {
          console.log('i18next initialized with language:', lang);
          console.log('Available languages:', i18next.languages);
          console.log('Current language:', i18next.language);
          updateTranslations();
          document.getElementById('current-lang').textContent = lang;
        })
        .catch(error => {
          console.error('Error initializing i18next:', error);
        });

      function updateTranslations() {
        console.log('Updating translations...');
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          const translation = i18next.t(key);
          console.log(`Translating ${key} to: ${translation}`);
          el.textContent = translation;
        });
      }

      // Rendre la fonction globale pour qu'elle soit accessible depuis les boutons
      window.changeLang = function (newLang) {
        console.log('Changing language to:', newLang);
        i18next
          .changeLanguage(newLang)
          .then(() => {
            console.log('Language changed successfully');
            updateTranslations();
            document.getElementById('current-lang').textContent = newLang;
          })
          .catch(error => {
            console.error('Error changing language:', error);
          });
      };
    </script>
  </body>
</html>
