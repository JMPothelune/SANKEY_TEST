<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
      <title>Données (data)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/tailwind.css" />
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  
  <!-- Charger data.js pour avoir lotStructure -->
  <script src="data.js"></script>
  <script src="color_mappings.js"></script>
  <script src="lot_type_creation.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    function extractDimensions(structure, dims = new Set()) {
      if (typeof structure === 'object' && structure !== null) {
        Object.keys(structure).forEach(key => {
          dims.add(key);
          extractDimensions(structure[key], dims);
        });
      }
      return dims;
    }

    // Fonction pour extraire la liste des noms d'une dimension 
    function extractNamesForDimension(dimension, data, structure) {
      if (!structure || typeof structure !== 'object') return [];
      if (Object.keys(structure).includes(dimension)) {
        const branch = data[dimension] || data;
        if (branch && typeof branch === 'object') {
          return Object.keys(branch);
        }
        return [];
      } else {
        for (const key in structure) {
          if (data[key]) {
            return extractNamesForDimension(dimension, data[key], structure[key]);
          }
        }
      }
      return [];
    }

    function collectAllNamesForDimension(dimension, data, structure, result = new Set()) {
      if (!structure || typeof structure !== 'object' || !data || typeof data !== 'object') return result;
      if (Object.keys(structure).includes(dimension)) {
        const branch = data[dimension] || data;
        if (branch && typeof branch === 'object') {
          Object.keys(branch).forEach(k => result.add(k));
        }
      }
      // Parcours récursif sur toutes les sous-branches
      for (const key in structure) {
        if (data[key]) {
          collectAllNamesForDimension(dimension, data[key], structure[key], result);
        }
      }
      return result;
    }

    // Fonction pour collecter tous les noms d'une dimension, à n'importe quelle profondeur
    function collectAllNamesDeep(dimension, data) {
      let result = new Set();
      if (!data || typeof data !== 'object') return result;
      if (data.hasOwnProperty(dimension) && typeof data[dimension] === 'object') {
        Object.keys(data[dimension]).forEach(k => result.add(k));
      }
      for (const key in data) {
        if (typeof data[key] === 'object') {
          collectAllNamesDeep(dimension, data[key]).forEach(k => result.add(k));
        }
      }
      return result;
    }

    // Utilitaire pour convertir une couleur D3 en hexadécimal
    function toHex(color) {
      if (!color) return '#bbb';
      // Si déjà hex
      if (typeof color === 'string' && color.startsWith('#')) return color;
      // Si c'est un objet d3.color
      if (typeof color === 'object' && color.formatHex) return color.formatHex();
      // Si c'est un string rgb/rgba
      if (typeof color === 'string' && color.startsWith('rgb')) {
        const rgb = color.match(/\d+/g);
        if (rgb && rgb.length >= 3) {
          return '#' + rgb.slice(0,3).map(x => (+x).toString(16).padStart(2, '0')).join('');
        }
      }
      return '#bbb';
    }

    // Générateur de palette HSL avec variation de teinte, saturation et luminosité
    function generateVarietyPalette(names, hCenter, hSpread=30, s=60, l=55, sSpread=20, lSpread=20) {
      const n = names.length;
      const palette = {};
      names.forEach((name, i) => {
        // Teinte
        const h = hCenter - hSpread/2 + hSpread * (i / Math.max(1, n-1));
        // Saturation et luminosité varient aussi
        const sat = s - sSpread/2 + sSpread * ((i % Math.max(2, n-1)) / Math.max(1, n-1));
        const lum = l - lSpread/2 + lSpread * ((i*3 % Math.max(2, n-1)) / Math.max(1, n-1));
        palette[name] = d3.hsl(h, sat/100, lum/100).formatHex();
      });
      return palette;
    }

    function collectFormats() {
      const typesData = collectTypes();
      const formats = Object.keys(allFormats);
      const formatsPalette = window.colorMappings?.formats || {};

      // Générer une palette pour les formats si elle n'existe pas
      if (Object.keys(formatsPalette).length === 0) {
        formats.forEach((format, i) => {
          formatsPalette[format] = toHex(d3.interpolateYlGn(0.2 + 0.6 * (i / Math.max(1, formats.length - 1))));
        });
      }

      const result = {};
      formats.forEach(format => {
        const formatObj = allFormats[format];
        const types = {};
        Object.keys(formatObj.types || {}).forEach(type => {
          types[type] = typesData[type] || {};
          if (types[type]) {
            types[type].pourcentage = formatObj.types[type].pourcentage;
          }
        });
        result[format] = {
          color: formatsPalette[format] || '#bbb',
          types: types
        };
      });
      return result;
    }

    // Fonction pour charger la palette des types depuis types.json
    function collectTypesPalette() {
      // Si déjà chargée, ne rien faire
      if (window.typesData) return window.typesData;
      // Si le JSON est déjà chargé côté serveur, on peut l'injecter ici
      // Sinon, il faudrait le charger dynamiquement (AJAX/fetch)
      // Pour l'instant, on suppose qu'il est injecté côté serveur ou déjà dans window.typesData
      return window.typesData || {};
    }

    function collectPerturbateurs() {
      const perturbateurSet = new Set();
      Object.values(repartitionParType).forEach(typeObj => {
        if (typeObj.perturbateurs) {
          typeObj.perturbateurs.forEach(obj => {
            if (obj.nom) perturbateurSet.add(obj.nom);
          });
        }
      });
      const perturbateurs = Array.from(perturbateurSet);
      const palette = generateVarietyPalette(perturbateurs, 10, 30, 70, 55); // rouges variés
      const result = {};
      perturbateurs.forEach(nom => {
        result[nom] = {
          color: palette[nom]
        };
      });
      window.colorMappings.perturbateurs = result;
      return result;
    }

    // S'assurer que la palette des perturbateurs est générée dès le début
    if (!window.colorMappings.perturbateurs) {
      collectPerturbateurs();
    }

    function collectTypes() {
      // On récupère la structure des matières déjà enrichie par collectMatieres
      const matieresData = collectMatieres();
      const couleursPalette = window.colorMappings?.couleur || {};
      const perturbateursPalette = window.colorMappings?.perturbateur || {};

      const types = [];
      Object.values(allFormats).forEach(formatObj => {
        if (formatObj.types) {
          Object.keys(formatObj.types).forEach(type => {
            if (!types.includes(type)) types.push(type);
          });
        }
      });

      // Palette pour les types (générée si absente)
      let typePalette = window.colorMappings?.types || {};
      if (Object.keys(typePalette).length === 0) {
        types.forEach((type, i) => {
          typePalette[type] = d3.interpolatePlasma(0.15 + 0.7 * (i / Math.max(1, types.length - 1)));
        });
      }

      const result = {};
      types.forEach(type => {
        const repType = repartitionParType[type] || {};

        // Matières
        const matieres = {};
        if (repType.matieres) {
          repType.matieres.forEach(m => {
            matieres[m.nom] = {
              pourcentage: m.pourcentage,
              color: matieresData[m.nom]?.color || '#bbb',
              fibres: matieresData[m.nom]?.fibres || {}
            };
          });
        }

        // Couleurs
        const couleurs = {};
        if (repType.couleurs) {
          repType.couleurs.forEach(c => {
            couleurs[c.nom] = {
              pourcentage: c.pourcentage,
              color: couleursPalette[c.nom] || '#bbb'
            };
          });
        }

        // Perturbateurs
        const perturbateurs = {};
        if (repType.perturbateurs) {
          repType.perturbateurs.forEach(p => {
            perturbateurs[p.nom] = {
              pourcentage: p.pourcentage,
              color: window.colorMappings.perturbateurs[p.nom]?.color || '#bbb'
            };
          });
        }

        // Toujours retourner un objet, même si tout est vide
        result[type] = {
          color: typePalette[type] || '#bbb',
          matieres: matieres,
          couleurs: couleurs,
          perturbateurs: perturbateurs
        };
      });
      return result;
    }

    function collectMatieres() {
      const matieres = Object.keys(matieres_fibres);
      // Plus de variété : spread 80, saturation et luminosité varient
      const palette = generateVarietyPalette(matieres, 270, 80, 55, 55, 30, 25); // violets variés
      const fibresPalette = window.fibresData || {};
      const result = {};
      matieres.forEach(matiere => {
        // Récupérer la répartition des fibres pour cette matière
        const fibresData = matieres_fibres[matiere]?.fibres || {};
        const fibres = {};
        Object.entries(fibresData).forEach(([fibre, obj]) => {
          fibres[fibre] = {
            pourcentage: obj.pourcentage,
            color: (fibresPalette[fibre] && fibresPalette[fibre].color) || '#bbb'
          };
        });
        result[matiere] = {
          color: palette[matiere],
          fibres: fibres
        };
      });
      return result;
    }

    function collectFibres() {
      const fibreSet = new Set();
      Object.values(matieres_fibres).forEach(matiereObj => {
        if (matiereObj.fibres) {
          Object.keys(matiereObj.fibres).forEach(fibre => fibreSet.add(fibre));
        }
      });
      const fibres = Array.from(fibreSet);
      const palette = generateVarietyPalette(fibres, 30, 40, 70, 55); // oranges variés
      const result = {};
      fibres.forEach(fibre => {
        result[fibre] = {
          color: palette[fibre]
        };
      });
      return result;
    }

    function collectCouleurs() {
      const couleurSet = new Set();
      Object.values(repartitionParType).forEach(typeObj => {
        if (typeObj.couleurs) {
          typeObj.couleurs.forEach(couleurObj => {
            if (couleurObj.nom) couleurSet.add(couleurObj.nom);
          });
        }
      });
      const couleurs = Array.from(couleurSet);
      // Palette statique pour les couleurs connues, dynamique pour les autres
      const staticPalette = window.colorMappings?.couleur || {};
      const dynamicPalette = generateVarietyPalette(couleurs.filter(c => !staticPalette[c]), 0, 0, 0, 80); // gris par défaut
      const result = {};
      couleurs.forEach(nom => {
        result[nom] = {
          color: staticPalette[nom] || dynamicPalette[nom] || '#bbb'
        };
      });
      return result;
    }

    function collectQualite() {
      const qualites = Object.keys(qualiteDistrib);
      const palette = generateVarietyPalette(qualites, 50, 30, 80, 60); // jaunes variés
      const result = {};
      qualites.forEach(q => {
        result[q] = {
          color: palette[q]
        };
      });
      return result;
    }

    function collectProprete() {
      const propretes = Object.keys(propreteDistrib);
      const palette = generateVarietyPalette(propretes, 180, 40, 60, 60); // turquoise variés
      const result = {};
      propretes.forEach(p => {
        result[p] = {
          color: palette[p]
        };
      });
      return result;
    }

    // Affichage en cartes verticales pour toutes les dimensions
    function renderCardsForObject(obj) {
      const container = document.createElement('div');
      container.className = 'flex flex-col gap-2';
      Object.entries(obj).forEach(([nom, val]) => {
        const card = document.createElement('div');
        card.className = 'rounded shadow px-3 py-2 text-xs font-mono border cursor-pointer collapsible-card';
        card.style.background = (val && typeof val === 'object' && val.color) ? val.color : '#fff';
        card.style.color = (val && typeof val === 'object' && val.color) ? '#fff' : '#222';
        card.style.minWidth = '180px';
        card.style.maxWidth = '100%';
        card.style.wordBreak = 'break-all';
        // Titre
        const keySpan = document.createElement('span');
        keySpan.textContent = `${nom} ${val.color}`;
        keySpan.style.fontWeight = 'bold';
        keySpan.style.cursor = 'pointer';
        keySpan.title = 'Copier la couleur';
        keySpan.addEventListener('click', function(e) {
          e.stopPropagation(); // N'ouvre pas la card
          navigator.clipboard.writeText(val.color);
        });
        card.appendChild(keySpan);
        // Détail JSON (caché par défaut)
        const pre = document.createElement('pre');
        pre.textContent = JSON.stringify(val, null, 2);
        pre.style.display = 'none';
        pre.style.background = 'transparent';
        pre.style.color = 'inherit';
        pre.style.margin = '0';
        pre.style.padding = '0';
        card.appendChild(pre);
        // Toggle au clic sur toute la carte
        card.addEventListener('click', (e) => {
          pre.style.display = (pre.style.display === 'none') ? 'block' : 'none';
        });
        container.appendChild(card);
      });
      return container;
    }

    // Surcharge de l'affichage du preview pour toutes les dimensions
    function updatePreview(activeDimension, activeData) {
      const preview = document.getElementById('json-preview');
      preview.innerHTML = '';
      if (activeData && typeof activeData === 'object' && !Array.isArray(activeData)) {
        preview.appendChild(renderCardsForObject(activeData));
      } else {
        preview.textContent = JSON.stringify(activeData, null, 2);
      }
    }

    // Fonction pour générer tous les JSONs et les proposer en téléchargement
    function createAllJsons() {
      let previewText = '';
      const dimensionFunctions = {
        formats: collectFormats,
        types: collectTypes,
        matieres: collectMatieres,
        fibres: collectFibres,
        couleurs: collectCouleurs,
        perturbateurs: collectPerturbateurs,
        qualite: collectQualite,
        proprete: collectProprete
      };
      const structure = window.lotStructure;
      const dimensions = Array.from(extractDimensions(structure));
      // Stocker les blobs dans un objet global
      window.jsonBlobs = {};
      // 1. Générer d'abord les fibres et stocker l'objet dans window.fibresData
      const fibresData = collectFibres();
      window.fibresData = fibresData;
      // 2. Générer la palette des types
      window.typesData = collectTypesPalette();
      // 3. Générer les autres dimensions dans l'ordre
      dimensions.forEach(dimension => {
        let data;
        if (dimension === 'fibres') {
          data = fibresData;
        } else if (dimension === 'types') {
          data = collectTypes();
        } else {
          data = dimensionFunctions[dimension]();
        }
        // Générer le JSON et stocker le blob
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        window.jsonBlobs[dimension] = blob;
      });
      // Afficher uniquement la dimension active
      const activeDimension = document.querySelector('.dimension-btn.bg-blue-600').dataset.dim;
      const activeData = dimensionFunctions[activeDimension]();
      updatePreview(activeDimension, activeData);
    }

    // Fonction pour télécharger tous les JSONs d'un coup
    function downloadAllJsons() {
      if (!window.jsonBlobs) {
        alert('Veuillez d\'abord cliquer sur "Créer" pour générer les JSONs.');
        return;
      }
      Object.entries(window.jsonBlobs).forEach(([dimension, blob]) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = dimension + ".json";
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    }

    // Génération des boutons
    const btnGroup = document.getElementById('dimension-buttons');
    if (window.lotStructure && btnGroup) {
      const dimensions = Array.from(extractDimensions(window.lotStructure));
      btnGroup.innerHTML = dimensions.map((dim, i) => {
        // Ajout du compteur si le collecteur a été exécuté
        let count = '';
        if (window.jsonBlobs && window.jsonBlobs[dim]) {
          try {
            // On lit le blob pour compter les éléments
            const reader = new FileReader();
            reader.onload = function(e) {
              try {
                const data = JSON.parse(e.target.result);
                let n = 0;
                if (Array.isArray(data)) n = data.length;
                else if (typeof data === 'object' && data !== null) n = Object.keys(data).length;
                const btn = btnGroup.querySelector(`button[data-dim='${dim}']`);
                if (btn) btn.innerHTML = `${dim} <span class='text-xs text-gray-500'>(${n})</span>`;
              } catch {}
            };
            reader.readAsText(window.jsonBlobs[dim]);
          } catch {}
        }
        return `<button type="button" class="dimension-btn px-3 py-1 m-1 rounded border text-sm font-medium ${i === 0 ? 'bg-blue-600 text-white border-blue-600' : 'bg-blue-100 text-blue-800 hover:bg-blue-200 border-blue-200'}" data-dim="${dim}">${dim}</button>`;
      }).join(' ');
      // Gestion de l'état actif
      const allBtns = btnGroup.querySelectorAll('.dimension-btn');
      function setActive(btn) {
        allBtns.forEach(b => b.classList.remove('bg-blue-600', 'text-white', 'border-blue-600'));
        allBtns.forEach(b => b.classList.add('bg-blue-100', 'text-blue-800', 'border-blue-200'));
        btn.classList.remove('bg-blue-100', 'text-blue-800', 'border-blue-200');
        btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
      }
      allBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          setActive(this);
          // Ne mettre à jour l'affichage que si on a déjà cliqué sur Créer
          if (window.jsonBlobs) {
            const activeDimension = btn.dataset.dim;
            const dimensionFunctions = {
              formats: collectFormats,
              types: collectTypes,
              matieres: collectMatieres,
              fibres: collectFibres,
              couleurs: collectCouleurs,
              perturbateurs: collectPerturbateurs,
              qualite: collectQualite,
              proprete: collectProprete
            };
            const activeData = dimensionFunctions[activeDimension]();
            updatePreview(activeDimension, activeData);
          }
        });
      });
      // Ne rien afficher par défaut
      document.getElementById('json-preview').textContent = '';
    } else {
      btnGroup.innerHTML = '<span class="text-red-600">Erreur : lotStructure non chargé</span>';
    }

    // Lier le bouton 'Créer' à la génération de tous les JSONs
    document.getElementById('btn-creer').addEventListener('click', function() {
      createAllJsons();
      setTimeout(updateDimensionCounts, 100);
    });

    // Lier le bouton 'Télécharger' au téléchargement de tous les JSONs
    document.getElementById('btn-telecharger').addEventListener('click', function() {
      downloadAllJsons();
    });

    // Lier le bouton 'lot type' à la création et au téléchargement du lotType
    document.getElementById('btn-lottype').addEventListener('click', function() {
      window.createLotType();
      setTimeout(updateDimensionCounts, 100);
    });

    // Exposer les fonctions dans le scope global
    window.collectTypesPalette = collectTypesPalette;
    window.collectPerturbateurs = collectPerturbateurs;
    window.collectCouleurs = collectCouleurs;
    window.collectQualite = collectQualite;
    window.collectProprete = collectProprete;
    window.collectFormats = collectFormats;
    window.createAllJsons = createAllJsons;

    function updateDimensionCounts() {
      const btnGroup = document.getElementById('dimension-buttons');
      if (!window.jsonBlobs) return;
      const allBtns = btnGroup.querySelectorAll('.dimension-btn');
      allBtns.forEach(btn => {
        const dim = btn.dataset.dim;
        if (window.jsonBlobs[dim]) {
          const reader = new FileReader();
          reader.onload = function(e) {
            try {
              const data = JSON.parse(e.target.result);
              let n = 0;
              if (Array.isArray(data)) n = data.length;
              else if (typeof data === 'object' && data !== null) n = Object.keys(data).length;
              // Met à jour le texte du bouton
              btn.innerHTML = `${dim} <span class='text-xs text-gray-500'>(${n})</span>`;
            } catch {
              btn.innerHTML = dim;
            }
          };
          reader.readAsText(window.jsonBlobs[dim]);
        } else {
          btn.innerHTML = dim;
        }
      });
    }
  });
  </script>

  <div class="w-full flex justify-start p-4">
    <a href="../index.html" class="inline-flex items-center px-3 py-1 rounded bg-gray-100 text-gray-600 hover:bg-gray-200 text-sm font-medium shadow-sm border border-gray-200">
      ← Retour
    </a>
  </div>

  <!-- Button group des dimensions et bouton Créer -->
  <div class="w-full flex justify-between items-center p-4">
    <div id="dimension-buttons" style="margin: 20px 0;"></div>
    <div class="buttons">
      <button id="btn-creer" class="px-4 py-2 rounded bg-blue-600 text-white font-bold shadow hover:bg-blue-700">Créer</button>
      <button id="btn-telecharger" class="px-4 py-2 rounded bg-green-600 text-white font-bold shadow hover:bg-green-700">Télécharger</button>
      <button id="btn-lottype" class="px-4 py-2 rounded bg-yellow-500 text-white font-bold shadow hover:bg-yellow-600">lot type</button>
    </div>
  </div>
    
  <!-- Aperçu du JSON généré -->
  <div class="w-full flex justify-center">
    <pre id="json-preview" class="rounded p-4 w-full max-w-3xl text-xs overflow-x-auto"></pre>
  </div>

  <style>
    .collapsible-card:hover {
      box-shadow: 0 2px 8px #0002;
    }
    .collapsible-card pre {
      transition: all 0.2s;
    }
  </style>

</body>
